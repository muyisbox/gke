name: external-secrets
chart: external-secrets
repoURL: https://charts.external-secrets.io
targetRevision: "2.11.0"
namespace: external-secrets
cluster_env: dev
helm:
  values:
    replicaCount: 2
    serviceAccount:
      create: true
      annotations:
        iam.gke.io/gcp-service-account: eso-controller@cluster-dreams.iam.gserviceaccount.com
    serviceMonitor:
      enabled: true
      labels:
        release: prometheus-monitoring
    webhook:
      replicaCount: 1
    certController:
      replicaCount: 1
    # The ClusterSecretStore lives here rather than in Terraform so that one
    # system owns ESO end to end. Helm orders it after the CRDs, which removes
    # the bootstrap race Terraform had against ArgoCD on a fresh cluster.
    extraObjects:
      - apiVersion: external-secrets.io/v1
        kind: ClusterSecretStore
        metadata:
          name: gcp-secret-manager
        spec:
          provider:
            gcpsm:
              projectID: cluster-dreams
              auth:
                workloadIdentity:
                  clusterLocation: us-central1
                  clusterName: dev-cluster
                  clusterProjectID: cluster-dreams
                  serviceAccountRef:
                    name: external-secrets
                    namespace: external-secrets
