name: istiod
chart: istiod
repoURL: https://istio-release.storage.googleapis.com/charts
targetRevision: "1.30.5"
namespace: istio-system
cluster_env: dev
# istiod rewrites its validating webhook's failurePolicy from the chart's
# Ignore to Fail once it is serving, so the rendered value never matches.
ignoreDifferences:
  - group: admissionregistration.k8s.io
    kind: ValidatingWebhookConfiguration
    jqPathExpressions:
      - .webhooks[]?.failurePolicy
helm:
  values:
    pilot:
      autoscaleEnabled: true
      autoscaleMin: 2
      autoscaleMax: 4
    revision: "1-30"
    revisionTags:
      - stable
