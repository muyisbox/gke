name: istiod
chart: istiod
repoURL: https://istio-release.storage.googleapis.com/charts
targetRevision: "1.30.5"
namespace: istio-system
cluster_env: dev
# istiod rewrites its validating webhook's failurePolicy from the chart's
# Ignore to Fail once it is serving, so the rendered value never matches.
ignoreDifferences:
  - group: admissionregistration.k8s.io
    kind: ValidatingWebhookConfiguration
    jqPathExpressions:
      - .webhooks[]?.failurePolicy
helm:
  values:
    pilot:
      env:
        # The sidecar runs as a Kubernetes native sidecar (an init container
        # with restartPolicy: Always) and so exits with the pod. As an
        # ordinary container it outlives the job it sits beside, and every
        # Job -- Helm hooks included -- would never complete.
        ENABLE_NATIVE_SIDECARS: "true"
      # Percent of requests traced. Enough to see every route in a demo
      # mesh without tracing every request.
      traceSampling: 10.0
      autoscaleEnabled: true
      autoscaleMin: 2
      autoscaleMax: 4
    revision: "1-30"
    revisionTags:
      - stable
    global:
      proxy:
        # Istio's default is 100m per sidecar. Across every pod on three small
        # clusters that is several cores reserved by proxies that idle at a
        # few millicores here.
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            memory: 256Mi
    meshConfig:
      enableTracing: true
      defaultProviders:
        metrics: [prometheus]
        tracing: [otel-tracing]
        accessLogging: [envoy-json]
      extensionProviders:
        # One JSON line per request on stdout, collected into Loki like any
        # container log. trace_id is what Grafana's Loki datasource turns
        # into a link to the trace; only sampled requests (10%) have a trace
        # in Tempo to link to.
        - name: envoy-json
          envoyFileAccessLog:
            path: /dev/stdout
            logFormat:
              labels:
                start_time: "%START_TIME%"
                method: "%REQ(:METHOD)%"
                path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                protocol: "%PROTOCOL%"
                response_code: "%RESPONSE_CODE%"
                response_flags: "%RESPONSE_FLAGS%"
                duration_ms: "%DURATION%"
                bytes_sent: "%BYTES_SENT%"
                authority: "%REQ(:AUTHORITY)%"
                upstream_cluster: "%UPSTREAM_CLUSTER%"
                upstream_host: "%UPSTREAM_HOST%"
                request_id: "%REQ(X-REQUEST-ID)%"
                trace_id: "%TRACE_ID%"
        # Each sidecar sends spans to the OTel collector on this cluster,
        # which forwards them to Tempo on the hub with everything else.
        - name: otel-tracing
          opentelemetry:
            service: otel-kube-stack-daemon-collector.opentelemetry.svc.cluster.local
            port: 4317
