name: kyverno
chart: kyverno
repoURL: https://kyverno.github.io/kyverno
targetRevision: "3.9.1"
namespace: kyverno
cluster_env: dev
# The chart renders `labels: {}` on its policies.kyverno.io CRDs; server-side
# apply drops empty maps, so the live CRDs never carry the key and the app
# shows OutOfSync permanently.
ignoreDifferences:
  - group: apiextensions.k8s.io
    kind: CustomResourceDefinition
    jsonPointers:
      - /metadata/labels
helm:
  values:
    admissionController:
      replicas: 2
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
    backgroundController:
      enabled: true
    cleanupController:
      enabled: true
    reportsController:
      enabled: true
    serviceMonitor:
      enabled: true
      labels:
        release: prometheus-monitoring
