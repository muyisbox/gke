name: kyverno
chart: kyverno
repoURL: https://kyverno.github.io/kyverno
targetRevision: "3.9.1"
namespace: kyverno
cluster_env: dev
helm:
  values:
    # The kyverno-api subchart renders `labels: {}` and `annotations: {}` on
    # its eleven policies.kyverno.io CRDs. Server-side apply drops empty
    # maps, so the live CRDs never match and selfHeal re-applied them in a
    # loop. Giving both maps content removes the drift at the source
    # rather than ignoring it. Prune=false also matters on its own:
    # pruning these CRDs would delete every policy built on them.
    kyverno-api:
      labels:
        app.kubernetes.io/part-of: kyverno
      annotations:
        argocd.argoproj.io/sync-options: Prune=false
    admissionController:
      replicas: 2
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
    backgroundController:
      enabled: true
    cleanupController:
      enabled: true
    reportsController:
      enabled: true
    serviceMonitor:
      enabled: true
      labels:
        release: prometheus-monitoring
