name: otel-kube-stack
# The only telemetry agent on this cluster. It collects logs, traces and
# metrics alike and ships all three to the hub; nothing is stored here, so
# nothing is lost when the cluster is destroyed overnight.
chart: opentelemetry-kube-stack
repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
targetRevision: "0.24.3"
namespace: opentelemetry
cluster_env: dev
helm:
  values:
    # The prometheus-operator CRDs come from the prometheus-operator-crds app.
    # This chart bundles an older copy (0.92.0 against 0.94.0) that fought
    # over the same objects. Only the OTel CRDs come from here.
    crds:
      installPrometheus: false
    # Becomes k8s.cluster.name on every signal. The chart defaults this to
    # "unknown_k8s_cluster"; with three clusters reporting to one hub it is the
    # attribute that says where anything came from.
    clusterName: dev

    collectors:
      # One per node: logs, traces, Kubernetes events, and the kubelet --
      # which can only be scraped per node.
      daemon:
        # The chart's default scrape file also scrapes node-exporter and
        # annotated pods, which the cluster collector below already covers
        # through their ServiceMonitors. One path per target, or every series
        # arrives twice.
        scrape_configs_file: ""
        presets:
          logsCollection:
            enabled: true
          kubernetesAttributes:
            enabled: true
          kubernetesEvents:
            enabled: true
          resourceDetection:
            env:
              enabled: true
            k8s_api:
              enabled: true
          # OTel-native host and kubelet metrics use semantic-convention names
          # (k8s.pod.cpu.usage, ...) that none of the hub's kube-prometheus
          # dashboards or rules understand. The Prometheus-format scrapes
          # below produce the names they expect.
          hostMetrics:
            enabled: false
          kubeletMetrics:
            enabled: false
          clusterMetrics:
            enabled: false

        config:
          receivers:
            prometheus/kubelet:
              config:
                scrape_configs:
                  - job_name: kubelet
                    metrics_path: /metrics
                    scheme: https
                    scrape_interval: 30s
                    honor_labels: true
                    authorization:
                      type: Bearer
                      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
                    tls_config:
                      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                      insecure_skip_verify: true
                    kubernetes_sd_configs:
                    - role: node
                      selectors:
                      - role: node
                        field: metadata.name=${env:OTEL_K8S_NODE_NAME}
                    relabel_configs:
                    - action: replace
                      target_label: job
                      replacement: kubelet
                    - action: replace
                      source_labels:
                      - __meta_kubernetes_node_name
                      target_label: node
                    - action: replace
                      target_label: endpoint
                      replacement: https-metrics
                    - action: replace
                      source_labels:
                      - __metrics_path__
                      target_label: metrics_path
                  - job_name: kubelet-cadvisor
                    metrics_path: /metrics/cadvisor
                    scheme: https
                    scrape_interval: 30s
                    honor_labels: true
                    honor_timestamps: true
                    authorization:
                      type: Bearer
                      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
                    tls_config:
                      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                      insecure_skip_verify: true
                    kubernetes_sd_configs:
                    - role: node
                      selectors:
                      - role: node
                        field: metadata.name=${env:OTEL_K8S_NODE_NAME}
                    relabel_configs:
                    - action: replace
                      target_label: job
                      replacement: kubelet
                    - action: replace
                      source_labels:
                      - __meta_kubernetes_node_name
                      target_label: node
                    - action: replace
                      target_label: endpoint
                      replacement: https-metrics
                    - action: replace
                      source_labels:
                      - __metrics_path__
                      target_label: metrics_path
                    metric_relabel_configs:
                    - action: drop
                      source_labels:
                      - __name__
                      regex: container_cpu_(load_average_10s|system_seconds_total|user_seconds_total)
                    - action: drop
                      source_labels:
                      - __name__
                      regex: container_fs_(io_current|reads_merged_total|sector_reads_total|sector_writes_total|writes_merged_total)
                    - action: drop
                      source_labels:
                      - __name__
                      regex: container_memory_(mapped_file|swap)
                    - action: drop
                      source_labels:
                      - __name__
                      regex: container_(file_descriptors|tasks_state|threads_max)
                    - action: drop
                      source_labels:
                      - __name__
                      regex: container_spec.*
                    - action: drop
                      source_labels:
                      - id
                      - pod
                      regex: .+;
          processors:
            # Every Grafana dashboard and recording rule on the hub selects by
            # `cluster`. A datapoint attribute becomes a Prometheus label; the
            # k8s.cluster.name resource attribute would not.
            transform/cluster:
              metric_statements:
                - context: datapoint
                  statements:
                    - set(attributes["cluster"], "dev_cluster")
            batch: {}
          exporters:
            # The hub's gateway is the only telemetry endpoint a spoke knows;
            # it fans out to Prometheus, Loki and Tempo on the far side.
            otlp/hub:
              endpoint: 10.30.127.200:4317
              tls:
                insecure: true
              retry_on_failure:
                enabled: true
              # Absorbs a hub restart or a brief network fault instead of
              # dropping the batch on the floor.
              sending_queue:
                enabled: true
                queue_size: 5000
          service:
            pipelines:
              # otlp too: an app pushing metrics to its node's collector
              # reaches the hub the same way the scraped ones do.
              metrics:
                receivers: [prometheus/kubelet, otlp]
                processors: [transform/cluster, batch]
                exporters: [otlp/hub]
              traces:
                exporters: [otlp/hub]
              logs:
                exporters: [otlp/hub]

      # One per cluster: everything that has a ServiceMonitor or PodMonitor.
      # The target allocator reads those CRs the way a Prometheus server
      # would, so every app's existing ServiceMonitor keeps working with no
      # Prometheus here to read it.
      cluster:
        enabled: true
        suffix: cluster
        mode: statefulset
        replicas: 1
        targetAllocator:
          enabled: true
          allocationStrategy: consistent-hashing
          prometheusCR:
            enabled: true
            scrapeInterval: 30s
            # Empty selectors select everything, in every namespace. Apps
            # label their ServiceMonitors for kube-prometheus-stack's
            # release selector, which no longer means anything here.
            serviceMonitorSelector: {}
            podMonitorSelector: {}
        presets:
          logsCollection:
            enabled: false
          kubernetesAttributes:
            enabled: false
          kubernetesEvents:
            enabled: false
          hostMetrics:
            enabled: false
          kubeletMetrics:
            enabled: false
          clusterMetrics:
            enabled: false
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 1Gi
        config:
          receivers:
            # The operator fills in the target allocator endpoint.
            prometheus:
              config:
                scrape_configs: []
          processors:
            transform/cluster:
              metric_statements:
                - context: datapoint
                  statements:
                    - set(attributes["cluster"], "dev_cluster")
            batch: {}
          exporters:
            otlp/hub:
              endpoint: 10.30.127.200:4317
              tls:
                insecure: true
              retry_on_failure:
                enabled: true
              sending_queue:
                enabled: true
                queue_size: 5000
          service:
            pipelines:
              metrics:
                receivers: [prometheus]
                processors: [transform/cluster, batch]
                exporters: [otlp/hub]

    # Applied to the collector CRs the chart generates.
    defaultCRConfig:
      # A collector that cannot schedule is a blind spot, and these nodes run
      # hot. Same reasoning as #52 for Alloy.
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi

    # The operator is not optional here. This chart ships an
    # OpenTelemetryCollector custom resource rather than a DaemonSet directly,
    # and without the operator to reconcile it the CR is inert and nothing
    # collects anything.
    opentelemetry-operator:
      enabled: true
    # Auto-instrumentation of application code is a separate concern and
    # nothing here is instrumented yet.
    instrumentation:
      enabled: false

    # system-node-critical above is rejected in any namespace lacking a quota
    # whose scopeSelector matches it -- GKE only ships gcp-critical-pods in
    # kube-system and its own managed namespaces. Same thing that bit Alloy in
    # #52. pods: 1G mirrors GKE's: present, not limiting.
    extraObjects:
      - apiVersion: v1
        kind: ResourceQuota
        metadata:
          name: critical-pods
          namespace: opentelemetry
        spec:
          hard:
            pods: 1G
          scopeSelector:
            matchExpressions:
              - operator: In
                scopeName: PriorityClass
                values:
                  - system-node-critical
                  - system-cluster-critical

    # What kube-prometheus-stack used to provide on this cluster. Each ships
    # a ServiceMonitor that the cluster collector picks up, under the same
    # job names (kube-state-metrics, node-exporter, apiserver, kube-dns) the
    # hub's rules and dashboards select on.
    kubeStateMetrics:
      enabled: true
    nodeExporter:
      enabled: true
    kubernetesServiceMonitors:
      enabled: true
    kubeApiServer:
      enabled: true
    # GKE runs kube-dns, not CoreDNS. The control-plane components
    # (controller-manager, scheduler, etcd) are Google-managed and not
    # scrapeable, so they stay off.
    kubeDns:
      enabled: true
