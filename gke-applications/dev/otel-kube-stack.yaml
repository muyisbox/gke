name: otel-kube-stack
# The only telemetry agent on this cluster. It collects logs, traces and
# metrics alike and ships all three to the hub; nothing is stored here, so
# nothing is lost when the cluster is destroyed overnight.
chart: opentelemetry-kube-stack
repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
targetRevision: "0.24.3"
namespace: opentelemetry
cluster_env: dev
# Telemetry pipeline: kept out of the mesh (see the ApplicationSet template).
istioInjection: disabled
helm:
  values:
    # The prometheus-operator CRDs come from the prometheus-operator-crds app.
    # This chart bundles an older copy (0.92.0 against 0.94.0) that fought
    # over the same objects. Only the OTel CRDs come from here.
    crds:
      installPrometheus: false
    # Becomes k8s.cluster.name on every signal. The chart defaults this to
    # "unknown_k8s_cluster"; with three clusters reporting to one hub it is the
    # attribute that says where anything came from.
    clusterName: dev

    # The target allocator resolves each ServiceMonitor's TLS and auth
    # references itself. kube-prometheus-stack's kubelet and apiserver
    # monitors take their CA from the kube-root-ca.crt ConfigMap, and the
    # chart's role can read Secrets but not ConfigMaps, so both were skipped
    # ("unable to get configmap kube-root-ca.crt") and the hub had no kubelet,
    # cAdvisor or apiserver metrics. Appended to the chart's default rules.
    clusterRole:
      rules:
        - apiGroups: [""]
          resources: [configmaps]
          verbs: [get, list, watch]

    collectors:
      # One per node: logs, traces, Kubernetes events, and the kubelet --
      # which can only be scraped per node.
      daemon:
        # The chart's default scrape file also scrapes node-exporter and
        # annotated pods, which the cluster collector below already covers
        # through their ServiceMonitors. One path per target, or every series
        # arrives twice.
        scrape_configs_file: ""
        presets:
          logsCollection:
            enabled: true
          kubernetesAttributes:
            enabled: true
          kubernetesEvents:
            enabled: true
          resourceDetection:
            env:
              enabled: true
            k8s_api:
              enabled: true
          # OTel-native host and kubelet metrics use semantic-convention names
          # (k8s.pod.cpu.usage, ...) that none of the hub's kube-prometheus
          # dashboards or rules understand. The Prometheus-format scrapes
          # below produce the names they expect.
          hostMetrics:
            enabled: false
          kubeletMetrics:
            enabled: false
          clusterMetrics:
            enabled: false

        config:
          receivers:
            prometheus/kubelet:
              config:
                scrape_configs:
                  - job_name: kubelet
                    metrics_path: /metrics
                    scheme: https
                    scrape_interval: 30s
                    honor_labels: true
                    authorization:
                      type: Bearer
                      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
                    tls_config:
                      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                      insecure_skip_verify: true
                    kubernetes_sd_configs:
                    - role: node
                      selectors:
                      - role: node
                        field: metadata.name=${env:OTEL_K8S_NODE_NAME}
                    relabel_configs:
                    - action: replace
                      target_label: job
                      replacement: kubelet
                    - action: replace
                      source_labels:
                      - __meta_kubernetes_node_name
                      target_label: node
                    - action: replace
                      target_label: endpoint
                      replacement: https-metrics
                    - action: replace
                      source_labels:
                      - __metrics_path__
                      target_label: metrics_path
                  - job_name: kubelet-cadvisor
                    metrics_path: /metrics/cadvisor
                    scheme: https
                    scrape_interval: 30s
                    honor_labels: true
                    honor_timestamps: true
                    authorization:
                      type: Bearer
                      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
                    tls_config:
                      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                      insecure_skip_verify: true
                    kubernetes_sd_configs:
                    - role: node
                      selectors:
                      - role: node
                        field: metadata.name=${env:OTEL_K8S_NODE_NAME}
                    relabel_configs:
                    - action: replace
                      target_label: job
                      replacement: kubelet
                    - action: replace
                      source_labels:
                      - __meta_kubernetes_node_name
                      target_label: node
                    - action: replace
                      target_label: endpoint
                      replacement: https-metrics
                    - action: replace
                      source_labels:
                      - __metrics_path__
                      target_label: metrics_path
                    metric_relabel_configs:
                    - action: drop
                      source_labels:
                      - __name__
                      regex: container_cpu_(load_average_10s|system_seconds_total|user_seconds_total)
                    - action: drop
                      source_labels:
                      - __name__
                      regex: container_fs_(io_current|reads_merged_total|sector_reads_total|sector_writes_total|writes_merged_total)
                    - action: drop
                      source_labels:
                      - __name__
                      regex: container_memory_(mapped_file|swap)
                    - action: drop
                      source_labels:
                      - __name__
                      regex: container_(file_descriptors|tasks_state|threads_max)
                    - action: drop
                      source_labels:
                      - __name__
                      regex: container_spec.*
                    - action: drop
                      source_labels:
                      - id
                      - pod
                      regex: .+;
          processors:
            # Kubernetes Events come from the k8s_objects receiver, not a
            # pod's log file, so nothing gives them a service name (Loki files
            # them under unknown_service), and the resource-detection step
            # stamps the *collector's* own pod, node and host onto them, as if
            # the collector had written them. Name them, and drop the identity
            # that belongs to the collector rather than the event.
            transform/events:
              log_statements:
                - context: log
                  conditions:
                    - attributes["k8s.resource.name"] == "events"
                    - resource.attributes["k8s.resource.name"] == "events"
                  statements:
                    - set(resource.attributes["service.name"], "kubernetes-events")
                    - delete_key(resource.attributes, "k8s.pod.name")
                    - delete_key(resource.attributes, "k8s.pod.ip")
                    - delete_key(resource.attributes, "k8s.pod.uid")
                    - delete_key(resource.attributes, "k8s.node.name")
                    - delete_key(resource.attributes, "k8s.node.ip")
                    - delete_key(resource.attributes, "k8s.node.uid")
                    - delete_key(resource.attributes, "host.name")
            # Every Grafana dashboard and recording rule on the hub selects by
            # `cluster`. A datapoint attribute becomes a Prometheus label; the
            # k8s.cluster.name resource attribute would not.
            transform/cluster:
              metric_statements:
                - context: datapoint
                  statements:
                    - set(attributes["cluster"], "dev_cluster")
            batch: {}
          exporters:
            # The hub's gateway is the only telemetry endpoint a spoke knows;
            # it fans out to Prometheus, Loki and Tempo on the far side.
            otlp/hub:
              endpoint: 10.30.127.200:4317
              tls:
                insecure: true
              retry_on_failure:
                enabled: true
              # Absorbs a hub restart or a brief network fault instead of
              # dropping the batch on the floor.
              sending_queue:
                enabled: true
                queue_size: 5000
          service:
            pipelines:
              # otlp too: an app pushing metrics to its node's collector
              # reaches the hub the same way the scraped ones do.
              metrics:
                receivers: [prometheus/kubelet, otlp]
                processors: [transform/cluster, batch]
                exporters: [otlp/hub]
              traces:
                exporters: [otlp/hub]
              # Declaring processors replaces the chart's preset list rather
              # than adding to it, so the whole chain is spelled out --
              # dropping resource_detection/env would strip k8s.cluster.name
              # from every log. transform/events must run after it.
              logs:
                processors: [k8s_attributes, resource_detection/env, resource/hostname, transform/events, batch]
                exporters: [otlp/hub]

      # One per cluster: everything that has a ServiceMonitor or PodMonitor.
      # The target allocator reads those CRs the way a Prometheus server
      # would, so every app's existing ServiceMonitor keeps working with no
      # Prometheus here to read it.
      cluster:
        enabled: true
        suffix: cluster
        mode: statefulset
        replicas: 1
        targetAllocator:
          enabled: true
          allocationStrategy: consistent-hashing
          prometheusCR:
            enabled: true
            scrapeInterval: 30s
            # Empty selectors select everything, in every namespace. Apps
            # label their ServiceMonitors for kube-prometheus-stack's
            # release selector, which no longer means anything here.
            serviceMonitorSelector: {}
            podMonitorSelector: {}
        presets:
          logsCollection:
            enabled: false
          kubernetesAttributes:
            enabled: false
          kubernetesEvents:
            enabled: false
          hostMetrics:
            enabled: false
          kubeletMetrics:
            enabled: false
          clusterMetrics:
            enabled: false
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 1Gi
        config:
          receivers:
            # The operator fills in the target allocator endpoint.
            prometheus:
              config:
                scrape_configs: []
          processors:
            transform/cluster:
              metric_statements:
                - context: datapoint
                  statements:
                    - set(attributes["cluster"], "dev_cluster")
            batch: {}
          exporters:
            otlp/hub:
              endpoint: 10.30.127.200:4317
              tls:
                insecure: true
              retry_on_failure:
                enabled: true
              sending_queue:
                enabled: true
                queue_size: 5000
          service:
            pipelines:
              metrics:
                receivers: [prometheus]
                processors: [transform/cluster, batch]
                exporters: [otlp/hub]

    # Applied to the collector CRs the chart generates.
    defaultCRConfig:
      config:
        service:
          telemetry:
            logs:
              # Each error was followed by a multi-line Go stack trace, and
              # the log collector ships every line as its own record: ~10
              # level-less records per error, shown as UNK in Grafana. The
              # error line already names the component and the cause.
              disable_stacktrace: true
      # A collector that cannot schedule is a blind spot, and these nodes run
      # hot. Same reasoning as #52 for Alloy.
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi

    # The operator is not optional here. This chart ships an
    # OpenTelemetryCollector custom resource rather than a DaemonSet directly,
    # and without the operator to reconcile it the CR is inert and nothing
    # collects anything.
    opentelemetry-operator:
      enabled: true
    # Auto-instrumentation of application code is a separate concern and
    # nothing here is instrumented yet.
    instrumentation:
      enabled: false

    # system-node-critical above is rejected in any namespace lacking a quota
    # whose scopeSelector matches it -- GKE only ships gcp-critical-pods in
    # kube-system and its own managed namespaces. Same thing that bit Alloy in
    # #52. pods: 1G mirrors GKE's: present, not limiting.
    extraObjects:
      # Mesh metrics, for Kiali and Grafana: every Envoy's stats endpoint
      # (port http-envoy-prom; pods without it yield no targets), and
      # istiod's own. Picked up by the cluster collector's target allocator.
      - apiVersion: monitoring.coreos.com/v1
        kind: PodMonitor
        metadata:
          name: envoy-stats
          namespace: opentelemetry
        spec:
          jobLabel: envoy-stats
          namespaceSelector:
            any: true
          selector: {}
          podMetricsEndpoints:
            - port: http-envoy-prom
              path: /stats/prometheus
              interval: 30s
      # Kiali's chart ships a NetworkPolicy admitting only its own ports
      # (20001, 9090), which blocks its sidecar's stats port: the scrape
      # above timed out for every meshed Kiali. NetworkPolicies are
      # additive, so this opens 15090 to the collectors' namespace alone and
      # leaves Kiali's own policy intact.
      - apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: kiali-envoy-stats
          namespace: istio-system
        spec:
          podSelector:
            matchLabels:
              app.kubernetes.io/name: kiali
          policyTypes: [Ingress]
          ingress:
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: opentelemetry
              ports:
                - port: 15090
                  protocol: TCP
      - apiVersion: monitoring.coreos.com/v1
        kind: ServiceMonitor
        metadata:
          name: istiod
          namespace: opentelemetry
        spec:
          namespaceSelector:
            matchNames: [istio-system]
          # Two Services front the same istiod pods: the revision's and the
          # `stable` tag's. Only the tag's carries istio.io/tag; selecting
          # both would scrape istiod twice.
          selector:
            matchLabels:
              app: istiod
            matchExpressions:
              - key: istio.io/tag
                operator: DoesNotExist
          endpoints:
            - port: http-monitoring
              interval: 30s
      - apiVersion: v1
        kind: ResourceQuota
        metadata:
          name: critical-pods
          namespace: opentelemetry
        spec:
          hard:
            pods: 1G
          scopeSelector:
            matchExpressions:
              - operator: In
                scopeName: PriorityClass
                values:
                  - system-node-critical
                  - system-cluster-critical

    # What kube-prometheus-stack used to provide on this cluster. Each ships
    # a ServiceMonitor that the cluster collector picks up, under the same
    # job names (kube-state-metrics, node-exporter, apiserver, kube-dns) the
    # hub's rules and dashboards select on.
    kubeStateMetrics:
      enabled: true
    nodeExporter:
      enabled: true
    kubernetesServiceMonitors:
      enabled: true
    kubeApiServer:
      enabled: true
    # GKE runs kube-dns, not CoreDNS. The control-plane components
    # (controller-manager, scheduler, etcd) are Google-managed and not
    # scrapeable, so they stay off.
    kubeDns:
      enabled: true
