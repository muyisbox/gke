name: prometheus-monitoring
chart: kube-prometheus-stack
repoURL: https://prometheus-community.github.io/helm-charts
targetRevision: "91.5.0"
namespace: monitoring
cluster_env: dev
helm:
  values:
    # Helm never upgrades CRDs on `helm upgrade`. Every chart major from
    # 83 to 91 ships a newer prometheus-operator CRD set, so let the chart
    # run its own CRD upgrade job instead of applying them by hand.
    crds:
      upgradeJob:
        enabled: true
        forceConflicts: true
    externalLabels:
      cluster: dev_cluster
    alertmanager:
      alertmanagerSpec:
        replicas: 2
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: standard
              resources:
                requests:
                  storage: 5Gi
    grafana:
      additionalDataSources:
        - name: Loki
          access: proxy
          orgId: 1
          type: loki
          jsonData:
            tlsSkipVerify: true
          url: http://loki.logging.svc.cluster.local:3100
          version: 1
    prometheus:
      prometheusSpec:
        replicas: 2
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: standard
              resources:
                requests:
                  storage: 10Gi
    prometheusOperator:
      enabled: true
      admissionWebhooks:
        patch:
          podAnnotations:
            sidecar.istio.io/inject: "false"
