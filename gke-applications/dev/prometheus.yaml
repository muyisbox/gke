name: prometheus-monitoring
chart: kube-prometheus-stack
repoURL: https://prometheus-community.github.io/helm-charts
targetRevision: "91.5.0"
namespace: monitoring
cluster_env: dev
helm:
  values:
    # The chart's CRD upgrade job exists because `helm upgrade` never
    # touches CRDs. Nothing here runs `helm upgrade`: Argo renders the
    # chart with --include-crds and applies all ten CRDs itself with
    # server-side apply, which the app's managed-resource list confirms.
    # Rendering with the job on and off produces the same ten CRDs, so it
    # buys nothing -- and it costs: the sync parks indefinitely on
    # "waiting for completion of hook ClusterRoleBinding/
    # prometheus-monitoring-crds-upgrade", and the hook pulls
    # docker.io/busybox:latest, which these clusters cannot pull
    # anonymously (the same 401 that stops envoy-gateway refreshing).
    crds:
      enabled: true
    alertmanager:
      alertmanagerSpec:
        replicas: 2
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: standard
              resources:
                requests:
                  storage: 5Gi
    grafana:
      additionalDataSources:
        - name: Loki
          access: proxy
          orgId: 1
          type: loki
          jsonData:
            tlsSkipVerify: true
          url: http://loki.logging.svc.cluster.local:3100
          version: 1
    # Grafana lives on the hub. A spoke copy would query a Prometheus whose
    # data has already been shipped elsewhere, so it is a second console
    # showing a subset.
    grafana:
      enabled: false
    prometheus:
      prometheusSpec:
        # Was set at the top level of values, which kube-prometheus-stack does
        # not read, so it never reached the Prometheus spec. It matters now:
        # once three clusters remote-write into one store, this label is the
        # only thing keeping their series apart.
        externalLabels:
          cluster: dev_cluster
        # Scraping stays local -- ServiceMonitors across the cluster depend on
        # it -- but the result is written to the hub. externalLabels already
        # carries cluster=dev_cluster, which is what keeps the series apart
        # once they land in one store.
        remoteWrite:
          - url: http://10.30.127.201:9090/api/v1/write
            remoteTimeout: 30s
            queueConfig:
              capacity: 10000
              maxShards: 10
              minShards: 1
        # Local retention only has to cover a hub outage; the hub is the
        # long-term store.
        retention: 24h
        replicas: 2
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: standard
              resources:
                requests:
                  storage: 10Gi
    # Both of these ran as BestEffort (no requests at all), were packed onto the
    # smallest node in the cluster, and exited 2 in a crash loop.
    kube-state-metrics:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
    prometheusOperator:
      enabled: true
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 512Mi
      admissionWebhooks:
        patch:
          podAnnotations:
            sidecar.istio.io/inject: "false"
