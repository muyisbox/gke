name: velero
chart: velero
repoURL: https://vmware-tanzu.github.io/helm-charts
targetRevision: "12.2.0"
namespace: velero
cluster_env: dev
helm:
  values:
    # The GCP object-store and volume-snapshot plugins ship as an init
    # container. Without it the server exits with "unable to find plugin for
    # provider gcp" and no backup ever runs.
    initContainers:
      - name: velero-plugin-for-gcp
        image: velero/velero-plugin-for-gcp:v1.14.3
        imagePullPolicy: IfNotPresent
        volumeMounts:
          - mountPath: /target
            name: plugins
    configuration:
      backupStorageLocation:
        - name: default
          provider: gcp
          bucket: cluster-dreams-velero-backups
          # Every cluster shares one bucket; without a per-cluster prefix they
          # write into the same backup namespace and overwrite each other.
          prefix: dev
          # The GCP plugin will not authenticate from Workload Identity
          # alone: without this the location reports Unavailable with
          # "serviceAccount is expected to be provided as an item in
          # BackupStorageLocation's config" and no backup ever runs.
          config:
            serviceAccount: velero-controller@cluster-dreams.iam.gserviceaccount.com
      volumeSnapshotLocation:
        - name: default
          provider: gcp
          config:
            region: us-central1
            serviceAccount: velero-controller@cluster-dreams.iam.gserviceaccount.com
    # Auth comes from Workload Identity (see velero.tf), not a key file.
    credentials:
      useSecret: false
    serviceAccount:
      server:
        create: true
        name: velero
        annotations:
          iam.gke.io/gcp-service-account: velero-controller@cluster-dreams.iam.gserviceaccount.com
    schedules:
      nightly-backup:
        schedule: "0 2 * * *"
        template:
          excludedNamespaces:
            - kube-system
          storageLocation: default
          ttl: 720h
    deployNodeAgent: true
    nodeAgent:
      # Kept out of the mesh. It is a per-node agent that only talks to the
      # API server and GCS, so a sidecar buys nothing -- and as a DaemonSet it
      # must fit on every node: dev's e2-medium node has 8m of CPU left after
      # GKE's own system pods, and the 20m sidecar request made the agent
      # unschedulable there, leaving that node's volumes without backups.
      podLabels:
        sidecar.istio.io/inject: "false"
    resources:
      requests:
        cpu: 500m
        memory: 256Mi
