name: envoy-gateway
chart: gateway-helm
# Argo CD 3.x treats an oci:// repoURL as the full artifact path and
# ignores `chart` when resolving it, so the bare namespace made it look up
# a repository literally named "envoyproxy" -- Docker Hub answers that
# with 401, and the app never deployed.
repoURL: oci://docker.io/envoyproxy/gateway-helm
targetRevision: "v1.9.1"
namespace: envoy-gateway-system
cluster_env: gitops
helm:
  values:
    crds:
      enabled: false
    deployment:
      replicas: 2
      pod:
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchExpressions:
                      - key: control-plane
                        operator: In
                        values:
                          - envoy-gateway
                  topologyKey: kubernetes.io/hostname
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
