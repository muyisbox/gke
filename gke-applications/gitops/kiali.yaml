name: kiali-server
chart: kiali-server
repoURL: https://kiali.org/helm-charts
targetRevision: "2.32.0"
namespace: istio-system
cluster_env: gitops
helm:
  values:
    istio_namespace: istio-system
    deployment:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
    auth:
      strategy: anonymous
    # Left empty, the chart generates a random key on every render, so each
    # repo-server cache miss changes the ConfigMap and the config checksum,
    # shows the app OutOfSync and restarts Kiali. With auth.strategy
    # anonymous no login tokens are issued, so the key guards nothing.
    login_token:
      signing_key: "CcRqw0m1NUxbrE6OtPjIEIKdcAiRAF1y"
    external_services:
      prometheus:
        url: http://prometheus-monitoring-kube-prometheus.monitoring:9090
        # The hub Prometheus holds every cluster's metrics. Without a scope
        # Kiali would draw dev and staging traffic into this mesh's graph.
        query_scope:
          cluster: gitops_cluster
      istio:
        config_map_name: istio
        istio_namespace: istio-system
        istiod_deployment_name: istiod
        istio_sidecar_injector_config_map_name: istio-sidecar-injector
    kiali_feature_flags:
      certificates_information_indicators:
        enabled: true
        secrets:
          - cacerts
          - istio-ca-secret
