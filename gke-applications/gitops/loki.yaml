name: loki
# The OSS Loki chart moved to the community repo at 6.55.0; grafana/loki 7.x is
# Grafana Enterprise Logs only. https://github.com/grafana/loki/issues/20705
chart: loki
repoURL: https://grafana-community.github.io/helm-charts
targetRevision: "18.13.5"
namespace: logging
cluster_env: gitops
# Telemetry pipeline: kept out of the mesh (see the ApplicationSet template).
istioInjection: disabled
helm:
  values:
    # Off. The canary writes a test line into Loki every second from every
    # node and reads it back, reporting the result as loki_canary_* metrics.
    # Nothing here consumed them -- no alert rule, no dashboard -- while its
    # lines, which carry no level, were 91% of all logs Grafana showed as
    # level "unknown". Loki's health is still covered by its own
    # ServiceMonitor metrics and probes.
    lokiCanary:
      enabled: false
    # The chart's Helm test drives the canary, and the chart refuses to render
    # with one but not the other. Argo CD never runs Helm tests anyway.
    test:
      enabled: false
    # Simple scalable mode: write (ingest + recent data), read (queries) and
    # backend (compactor/retention, index gateway, ruler) run as separate,
    # independently scaled and replicated components, with GCS as the store.
    # Monolithic kept everything in one pod on one local disk.
    deploymentMode: SimpleScalable
    # Workload Identity to the loki-storage service account, which can read
    # and write only the Loki bucket (observability-storage.tf).
    serviceAccount:
      name: loki
      annotations:
        iam.gke.io/gcp-service-account: loki-storage@cluster-dreams.iam.gserviceaccount.com
    loki:
      auth_enabled: false
      # Every stream is written to three ingesters, so a write pod or node
      # can go away without losing unflushed logs.
      commonConfig:
        replication_factor: 3
      storage:
        type: gcs
        bucketNames:
          chunks: cluster-dreams-loki
          ruler: cluster-dreams-loki
          admin: cluster-dreams-loki
      # One period, now on GCS. Logs from the monolithic era sat on its local
      # disk and are not carried over (a few hours' worth on a hub created
      # the same day).
      schemaConfig:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: gcs
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      # Retention: the compactor deletes chunks older than retention_period.
      # Delete requests are recorded in the bucket too, so they survive the
      # backend pods.
      compactor:
        retention_enabled: true
        delete_request_store: gcs
      limits_config:
        retention_period: 168h
    # The only memberlist peers are Loki's own pods; the headless Service
    # must publish them before they are Ready or the first pod can never join
    # a ring and become Ready to publish itself.
    memberlist:
      service:
        publishNotReadyAddresses: true
    write:
      # Fixed, not autoscaled: adding or removing ingesters reshuffles the
      # ring. Three, to hold three copies of every stream.
      replicas: 3
      persistence:
        volumeClaimsEnabled: true
        size: 10Gi
        storageClass: standard
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1Gi
    read:
      # Stateless query path: scales with query load.
      replicas: 2
      autoscaling:
        enabled: true
        minReplicas: 2
        maxReplicas: 4
        targetCPUUtilizationPercentage: 70
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
    backend:
      replicas: 2
      persistence:
        volumeClaimsEnabled: true
        size: 10Gi
        storageClass: standard
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
    singleBinary:
      replicas: 0
    # The rules sidecar was OOMKilled (exit 137) with no limit set.
    sidecar:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
    # Two, so the push and query endpoint survives a pod or node going away.
    gateway:
      replicas: 2
    # The chunks cache defaults to an 8Gi memcached, more than any node here
    # can allocate; at this log volume GCS reads alone are fast enough.
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    monitoring:
      serviceMonitor:
        enabled: true
        labels:
          release: prometheus-monitoring
