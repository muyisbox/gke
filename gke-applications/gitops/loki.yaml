name: loki
# The OSS Loki chart moved to the community repo at 6.55.0; grafana/loki 7.x is
# Grafana Enterprise Logs only. https://github.com/grafana/loki/issues/20705
chart: loki
repoURL: https://grafana-community.github.io/helm-charts
targetRevision: "18.13.5"
namespace: logging
cluster_env: gitops
# Telemetry pipeline: kept out of the mesh (see the ApplicationSet template).
istioInjection: disabled
helm:
  values:
    # Off. The canary writes a test line into Loki every second from every
    # node and reads it back, reporting the result as loki_canary_* metrics.
    # Nothing here consumed them -- no alert rule, no dashboard -- while its
    # lines, which carry no level, were 91% of all logs Grafana showed as
    # level "unknown". Loki's health is still covered by its own
    # ServiceMonitor metrics and probes.
    lokiCanary:
      enabled: false
    # The chart's Helm test drives the canary, and the chart refuses to render
    # with one but not the other. Argo CD never runs Helm tests anyway.
    test:
      enabled: false
    # "SingleBinary" is the deprecated spelling of this mode.
    deploymentMode: Monolithic
    loki:
      auth_enabled: false
      # No retention was configured, so the 10Gi filesystem would only ever
      # fill. The compactor deletes chunks older than retention_period; Loki
      # 3 refuses to start with retention on unless it has somewhere to
      # record delete requests.
      compactor:
        retention_enabled: true
        delete_request_store: filesystem
      limits_config:
        retention_period: 168h
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
      schemaConfig:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
    # loki-0 is the only memberlist peer, so the headless Service must publish
    # it before it is Ready. Otherwise DNS returns NXDOMAIN, the ring join hits
    # abort_if_cluster_join_fails, Loki exits, and it can never become Ready to
    # publish the address in the first place.
    memberlist:
      service:
        publishNotReadyAddresses: true
    singleBinary:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
    # The rules sidecar was OOMKilled (exit 137) with no limit set.
    sidecar:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
    # Unused in Monolithic mode, but the chart defaults them to non-zero.
    read:
      replicas: 0
    write:
      replicas: 0
    backend:
      replicas: 0
    gateway:
      replicas: 1
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    monitoring:
      serviceMonitor:
        enabled: true
        labels:
          release: prometheus-monitoring
