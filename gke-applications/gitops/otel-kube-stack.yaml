name: otel-kube-stack
# Replaces Alloy. One agent emitting logs, traces and Kubernetes events with a
# single resource-attribute model, so a pod's logs and its traces are keyed
# identically and can be correlated. Alloy could collect logs but gave no path
# to traces without a second pipeline whose labels would have to be kept in
# agreement by hand.
chart: opentelemetry-kube-stack
repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
targetRevision: "0.24.3"
namespace: opentelemetry
cluster_env: gitops
# Telemetry pipeline: kept out of the mesh (see the ApplicationSet template).
istioInjection: disabled
helm:
  values:
    # kube-prometheus-stack owns the prometheus-operator CRDs. This chart
    # bundles its own older copy (0.92.0 against 0.94.0), so the two apps
    # overwrote each other on every sync and left dev and staging running
    # the 0.94 operator against downgraded 0.92 CRDs. Only the OTel CRDs
    # come from here.
    crds:
      installPrometheus: false
    # Becomes k8s.cluster.name on every signal. The chart defaults this to
    # "unknown_k8s_cluster"; with three clusters reporting to one hub it is the
    # attribute that says where anything came from.
    clusterName: gitops

    # The target allocator resolves each ServiceMonitor's TLS and auth
    # references itself. kube-prometheus-stack's kubelet and apiserver
    # monitors take their CA from the kube-root-ca.crt ConfigMap, and the
    # chart's role can read Secrets but not ConfigMaps, so both were skipped
    # ("unable to get configmap kube-root-ca.crt") and the hub had no kubelet,
    # cAdvisor or apiserver metrics. Appended to the chart's default rules.
    clusterRole:
      rules:
        - apiGroups: [""]
          resources: [configmaps]
          verbs: [get, list, watch]

    collectors:
      daemon:
        # Kubelet per node, the same as the spokes (see below); everything
        # else through the cluster collector. The chart's default scrape file
        # would scrape node-exporter and annotated pods a second time.
        scrape_configs_file: ""
        presets:
          logsCollection:
            enabled: true
          kubernetesAttributes:
            enabled: true
          kubernetesEvents:
            enabled: true
          resourceDetection:
            env:
              enabled: true
            k8s_api:
              enabled: true
          # OTel-native host and kubelet metrics use semantic-convention names
          # that none of the kube-prometheus dashboards or rules understand.
          hostMetrics:
            enabled: false
          kubeletMetrics:
            enabled: false
          clusterMetrics:
            enabled: false

        config:
          exporters:
            # This is the hub, so its own collector reaches the backends
            # directly rather than looping out through the gateway's LB.
            otlp_grpc/tempo:
              endpoint: tempo.tracing.svc.cluster.local:4317
              tls:
                insecure: true
              # Rides out a Tempo restart instead of dropping after 5m.
              retry_on_failure:
                enabled: true
                max_elapsed_time: 15m
              sending_queue:
                enabled: true
                queue_size: 5000
            # Loki 3.x ingests OTLP natively, so no Loki-specific exporter.
            otlp_http/loki:
              endpoint: http://loki-gateway.logging.svc.cluster.local/otlp
              # Covers a Loki rollout or restart (the write ring re-forming), so
              # logs queue instead of being dropped after the default 5m.
              retry_on_failure:
                enabled: true
                max_elapsed_time: 15m
              sending_queue:
                enabled: true
                queue_size: 5000
            otlp_http/prometheus-0:
              endpoint: http://prometheus-prometheus-monitoring-kube-prometheus-0.prometheus-operated.monitoring.svc.cluster.local:9090/api/v1/otlp
              # A Prometheus replica restart, WAL replay included, outlasts the
              # default 5m of retries, and the batch is then dropped: replica 1
              # lost samples that way during a rollout.
              retry_on_failure:
                enabled: true
                max_elapsed_time: 15m
              sending_queue:
                enabled: true
                queue_size: 5000
            otlp_http/prometheus-1:
              endpoint: http://prometheus-prometheus-monitoring-kube-prometheus-1.prometheus-operated.monitoring.svc.cluster.local:9090/api/v1/otlp
              # A Prometheus replica restart, WAL replay included, outlasts the
              # default 5m of retries, and the batch is then dropped: replica 1
              # lost samples that way during a rollout.
              retry_on_failure:
                enabled: true
                max_elapsed_time: 15m
              sending_queue:
                enabled: true
                queue_size: 5000
            # Dual-write while Mimir is evaluated beside Prometheus. Mimir
            # replicates internally, so one exporter through its gateway is
            # enough. Same 15m retry and queue: an ingester rollout must not
            # drop batches, and a stalled Mimir only backs up this queue --
            # each exporter has its own, so Prometheus is not held up.
            otlp_http/mimir:
              endpoint: http://mimir-gateway.mimir.svc.cluster.local/otlp
              retry_on_failure:
                enabled: true
                max_elapsed_time: 15m
              sending_queue:
                enabled: true
                queue_size: 5000
          receivers:
            # kube-prometheus-stack's kubelet ServiceMonitor authenticates
            # with a token from a Secret, and the target allocator will not
            # serve Secret values over plain HTTP: the collector received the
            # literal string "<secret>" as its bearer token and every kubelet
            # scrape failed. Scraping per node with the pod's own
            # service-account token file avoids Secrets entirely.
            prometheus/kubelet:
              config:
                scrape_configs:
                  - job_name: kubelet
                    metrics_path: /metrics
                    scheme: https
                    scrape_interval: 30s
                    honor_labels: true
                    authorization:
                      type: Bearer
                      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
                    tls_config:
                      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                      insecure_skip_verify: true
                    kubernetes_sd_configs:
                    - role: node
                      selectors:
                      - role: node
                        field: metadata.name=${env:OTEL_K8S_NODE_NAME}
                    relabel_configs:
                    - action: replace
                      target_label: job
                      replacement: kubelet
                    - action: replace
                      source_labels:
                      - __meta_kubernetes_node_name
                      target_label: node
                    - action: replace
                      target_label: endpoint
                      replacement: https-metrics
                    - action: replace
                      source_labels:
                      - __metrics_path__
                      target_label: metrics_path
                  - job_name: kubelet-cadvisor
                    metrics_path: /metrics/cadvisor
                    scheme: https
                    scrape_interval: 30s
                    honor_labels: true
                    honor_timestamps: true
                    authorization:
                      type: Bearer
                      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
                    tls_config:
                      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                      insecure_skip_verify: true
                    kubernetes_sd_configs:
                    - role: node
                      selectors:
                      - role: node
                        field: metadata.name=${env:OTEL_K8S_NODE_NAME}
                    relabel_configs:
                    - action: replace
                      target_label: job
                      replacement: kubelet
                    - action: replace
                      source_labels:
                      - __meta_kubernetes_node_name
                      target_label: node
                    - action: replace
                      target_label: endpoint
                      replacement: https-metrics
                    - action: replace
                      source_labels:
                      - __metrics_path__
                      target_label: metrics_path
                    metric_relabel_configs:
                    - action: drop
                      source_labels:
                      - __name__
                      regex: container_cpu_(load_average_10s|system_seconds_total|user_seconds_total)
                    - action: drop
                      source_labels:
                      - __name__
                      regex: container_fs_(io_current|reads_merged_total|sector_reads_total|sector_writes_total|writes_merged_total)
                    - action: drop
                      source_labels:
                      - __name__
                      regex: container_memory_(mapped_file|swap)
                    - action: drop
                      source_labels:
                      - __name__
                      regex: container_(file_descriptors|tasks_state|threads_max)
                    - action: drop
                      source_labels:
                      - __name__
                      regex: container_spec.*
                    - action: drop
                      source_labels:
                      - id
                      - pod
                      regex: .+;
          processors:
            # Kubernetes Events come from the k8s_objects receiver, not a
            # pod's log file, so nothing gives them a service name (Loki files
            # them under unknown_service), and the resource-detection step
            # stamps the *collector's* own pod, node and host onto them, as if
            # the collector had written them. Name them, and drop the identity
            # that belongs to the collector rather than the event.
            # Many formats carry no level Loki can read, so Grafana showed them
            # as "unknown": klog (I/W/E/F prefix), and access logs, whose only
            # signal is the HTTP status. Classified here, once, the same on
            # every cluster. Tested against each format on the 0.159.0 image,
            # including controls (plain text and look-alikes stay unclassified).
            transform/severity:
              error_mode: ignore
              log_statements:
                - context: log
                  # Only records with no severity yet: events, and anything whose own
                  # format already carried a level, keep theirs.
                  conditions:
                    - severity_number == SEVERITY_NUMBER_UNSPECIFIED
                  statements:
                    # klog (Kubernetes components, VPA, ...): "I1011 03:55:25.75 ..." --
                    # the first letter is the level.
                    - set(severity_text, "INFO") where IsMatch(body, "^I[0-9]{4} ")
                    - set(severity_text, "WARN") where IsMatch(body, "^W[0-9]{4} ")
                    - set(severity_text, "ERROR") where IsMatch(body, "^E[0-9]{4} ")
                    - set(severity_text, "FATAL") where IsMatch(body, "^F[0-9]{4} ")
                    # zerolog console format (Kiali, kyverno): "<time> INF msg", where
                    # kyverno wraps the time and level in terminal colour codes. [[]
                    # matches a literal "[" without an escape OTTL may not accept.
                    - set(severity_text, "INFO") where IsMatch(body, "^[^ ]+ ([^ ]*[[][0-9;]*m)?INF([^ ]*[[][0-9;]*m)? ")
                    - set(severity_text, "WARN") where IsMatch(body, "^[^ ]+ ([^ ]*[[][0-9;]*m)?WRN([^ ]*[[][0-9;]*m)? ")
                    - set(severity_text, "ERROR") where IsMatch(body, "^[^ ]+ ([^ ]*[[][0-9;]*m)?ERR([^ ]*[[][0-9;]*m)? ")
                    - set(severity_text, "DEBUG") where IsMatch(body, "^[^ ]+ ([^ ]*[[][0-9;]*m)?DBG([^ ]*[[][0-9;]*m)? ")
                    - set(severity_text, "FATAL") where IsMatch(body, "^[^ ]+ ([^ ]*[[][0-9;]*m)?FTL([^ ]*[[][0-9;]*m)? ")
                    # Access logs carry no level, only a status. Three shapes: Istio/Envoy
                    # JSON ("response_code":503), standard nginx ("GET / HTTP/1.1" 503),
                    # and Loki's gateway, which logs the status first ("...+0000]  503
                    # "GET ..."). 5xx is an error, 4xx a warning, anything else info.
                    # ([]] matches a literal "]" without an escape OTTL may not accept.)
                    - set(severity_text, "ERROR") where IsMatch(body, "\"response_code\":5[0-9][0-9]") or IsMatch(body, "HTTP/[0-9.]+\" 5[0-9][0-9] ") or IsMatch(body, "[]] +5[0-9][0-9] \"")
                    - set(severity_text, "WARN") where IsMatch(body, "\"response_code\":4[0-9][0-9]") or IsMatch(body, "HTTP/[0-9.]+\" 4[0-9][0-9] ") or IsMatch(body, "[]] +4[0-9][0-9] \"")
                    - set(severity_text, "INFO") where severity_text == "" and (IsMatch(body, "\"response_code\":[0-9]") or IsMatch(body, "HTTP/[0-9.]+\" [0-9]{3} ") or IsMatch(body, "[]] +[0-9]{3} \""))
                    # The number Loki and Grafana sort and filter on, from the text.
                    - set(severity_number, SEVERITY_NUMBER_INFO) where severity_text == "INFO"
                    - set(severity_number, SEVERITY_NUMBER_WARN) where severity_text == "WARN"
                    - set(severity_number, SEVERITY_NUMBER_ERROR) where severity_text == "ERROR"
                    - set(severity_number, SEVERITY_NUMBER_FATAL) where severity_text == "FATAL"
                    - set(severity_number, SEVERITY_NUMBER_DEBUG) where severity_text == "DEBUG"
            transform/events:
              # A labelling step must never cost data: with the default
              # (propagate), one statement erroring on an oddly-shaped event
              # would drop the whole batch.
              error_mode: ignore
              log_statements:
                - context: log
                  conditions:
                    - attributes["k8s.resource.name"] == "events"
                    - resource.attributes["k8s.resource.name"] == "events"
                  statements:
                    - set(resource.attributes["service.name"], "kubernetes-events")
                    - delete_key(resource.attributes, "k8s.pod.name")
                    - delete_key(resource.attributes, "k8s.pod.ip")
                    - delete_key(resource.attributes, "k8s.pod.uid")
                    - delete_key(resource.attributes, "k8s.node.name")
                    - delete_key(resource.attributes, "k8s.node.ip")
                    - delete_key(resource.attributes, "k8s.node.uid")
                    - delete_key(resource.attributes, "host.name")
                    # The Event's type becomes the log level, so Warning events
                    # filter and colour as warnings in Grafana instead of all
                    # showing as "unknown".
                    - set(severity_text, "WARN") where body["object"]["type"] == "Warning"
                    - set(severity_number, SEVERITY_NUMBER_WARN) where body["object"]["type"] == "Warning"
                    - set(severity_text, "INFO") where body["object"]["type"] == "Normal"
                    - set(severity_number, SEVERITY_NUMBER_INFO) where body["object"]["type"] == "Normal"
            transform/cluster:
              metric_statements:
                - context: datapoint
                  statements:
                    - set(attributes["cluster"], "gitops_cluster")
            batch: {}
          # Logs and traces name only exporters: the presets above supply
          # their receivers and processors. Metrics has no preset feeding it,
          # so it names everything itself.
          service:
            pipelines:
              # Declared explicitly: setting this to null does not remove it.
              # Helm treats null as "drop my override", the chart's default
              # comes back, and that default scraped node-exporter, cAdvisor
              # and annotated pods into the debug exporter for nothing.
              metrics:
                receivers: [prometheus/kubelet, otlp]
                processors: [transform/cluster, batch]
                exporters: [otlp_http/prometheus-0, otlp_http/prometheus-1, otlp_http/mimir]
              traces:
                exporters: [otlp_grpc/tempo]
              # Declaring processors replaces the chart's preset list rather
              # than adding to it, so the whole chain is spelled out --
              # dropping resource_detection/env would strip k8s.cluster.name
              # from every log. transform/events must run after it.
              logs:
                processors: [k8s_attributes, resource_detection/env, resource/hostname, transform/events, transform/severity, batch]
                exporters: [otlp_http/loki]

      # Hub-only second collector. Spokes cannot reach Tempo or Loki directly,
      # so this is the one telemetry ingress on the VPC: it receives OTLP from
      # every cluster and fans out to the backends beside it.
      gateway:
        enabled: true
        mode: deployment
        # Fixes the CR name, and so the operator's pod labels that the
        # LoadBalancer Service below selects on.
        suffix: gateway
        replicas: 2
        # Nothing to scrape here; it only receives and forwards.
        presets:
          logsCollection:
            enabled: false
          kubernetesAttributes:
            enabled: false
          kubernetesEvents:
            enabled: false
          hostMetrics:
            enabled: false
          kubeletMetrics:
            enabled: false
          clusterMetrics:
            enabled: false
        config:
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                  # gRPC's default 4MiB message cap rejected a large batch from
                  # dev ("received message after decompression larger than
                  # max") -- a permanent error, so the batch was dropped, not
                  # retried. Spokes now cap batch size too; this is headroom.
                  max_recv_msg_size_mib: 32
                http:
                  endpoint: 0.0.0.0:4318
          exporters:
            otlp_grpc/tempo:
              endpoint: tempo.tracing.svc.cluster.local:4317
              tls:
                insecure: true
              # Rides out a Tempo restart instead of dropping after 5m.
              retry_on_failure:
                enabled: true
                max_elapsed_time: 15m
              sending_queue:
                enabled: true
                queue_size: 5000
            otlp_http/loki:
              endpoint: http://loki-gateway.logging.svc.cluster.local/otlp
              # Covers a Loki rollout or restart (the write ring re-forming), so
              # logs queue instead of being dropped after the default 5m.
              retry_on_failure:
                enabled: true
                max_elapsed_time: 15m
              sending_queue:
                enabled: true
                queue_size: 5000
            # The hub Prometheus runs two replicas, and pushed data is not
            # replicated between them. Sending through the Service would
            # load-balance each batch to one replica, leaving both with half
            # the data and every query a coin toss. Each replica gets its own
            # exporter, by pod DNS name, so both hold everything.
            otlp_http/prometheus-0:
              endpoint: http://prometheus-prometheus-monitoring-kube-prometheus-0.prometheus-operated.monitoring.svc.cluster.local:9090/api/v1/otlp
              # A Prometheus replica restart, WAL replay included, outlasts the
              # default 5m of retries, and the batch is then dropped: replica 1
              # lost samples that way during a rollout.
              retry_on_failure:
                enabled: true
                max_elapsed_time: 15m
              sending_queue:
                enabled: true
                queue_size: 5000
            otlp_http/prometheus-1:
              endpoint: http://prometheus-prometheus-monitoring-kube-prometheus-1.prometheus-operated.monitoring.svc.cluster.local:9090/api/v1/otlp
              # A Prometheus replica restart, WAL replay included, outlasts the
              # default 5m of retries, and the batch is then dropped: replica 1
              # lost samples that way during a rollout.
              retry_on_failure:
                enabled: true
                max_elapsed_time: 15m
              sending_queue:
                enabled: true
                queue_size: 5000
            # Dual-write while Mimir is evaluated beside Prometheus. Mimir
            # replicates internally, so one exporter through its gateway is
            # enough. Same 15m retry and queue: an ingester rollout must not
            # drop batches, and a stalled Mimir only backs up this queue --
            # each exporter has its own, so Prometheus is not held up.
            otlp_http/mimir:
              endpoint: http://mimir-gateway.mimir.svc.cluster.local/otlp
              retry_on_failure:
                enabled: true
                max_elapsed_time: 15m
              sending_queue:
                enabled: true
                queue_size: 5000
          processors:
            batch: {}
          service:
            pipelines:
              # Spoke metrics. They arrive already labelled with their
              # cluster, so the gateway only batches and forwards.
              metrics:
                receivers: [otlp]
                processors: [batch]
                exporters: [otlp_http/prometheus-0, otlp_http/prometheus-1, otlp_http/mimir]
              # receivers is mandatory on every pipeline. The daemon collector
              # can leave it out because its logsCollection and kubernetesEvents
              # presets inject receivers for it; the gateway runs with every
              # preset off, so nothing injects anything and the operator rejects
              # the CR outright with "spec.config.service.pipelines.logs
              # .receivers: Required value".
              traces:
                receivers: [otlp]
                exporters: [otlp_grpc/tempo]
              logs:
                receivers: [otlp]
                exporters: [otlp_http/loki]

      # One per cluster: everything with a ServiceMonitor or PodMonitor --
      # kube-prometheus-stack's own (kubelet, node-exporter,
      # kube-state-metrics, apiserver, ...) plus every app's. The target
      # allocator reads those CRs the way a Prometheus server would. The hub
      # Prometheus no longer scrapes at all; it only stores what arrives over
      # OTLP, the same way for the hub as for each spoke.
      cluster:
        enabled: true
        suffix: cluster
        mode: statefulset
        replicas: 1
        targetAllocator:
          enabled: true
          allocationStrategy: consistent-hashing
          prometheusCR:
            enabled: true
            scrapeInterval: 30s
            # Everything, except kube-prometheus-stack's kubelet and apiserver
            # monitors: both authenticate with a Secret, which the target
            # allocator redacts. The daemon scrapes the kubelet instead, and
            # the apiserver comes from this chart's own monitor (token file).
            # kube-prometheus-stack keeps both deployed, because its kubelet
            # and apiserver recording rules only render while they are.
            serviceMonitorSelector:
              matchExpressions:
                - key: app
                  operator: NotIn
                  values: [kube-prometheus-stack-kubelet, kube-prometheus-stack-apiserver]
            podMonitorSelector: {}
        presets:
          logsCollection:
            enabled: false
          kubernetesAttributes:
            enabled: false
          kubernetesEvents:
            enabled: false
          hostMetrics:
            enabled: false
          kubeletMetrics:
            enabled: false
          clusterMetrics:
            enabled: false
        resources:
          requests:
            # Ran ~118m against a 100m request on the hub, which scrapes the
            # most targets; under contention, scrapes timed out.
            cpu: 200m
            memory: 512Mi
          limits:
            memory: 1Gi
        config:
          receivers:
            # The operator fills in the target allocator endpoint.
            prometheus:
              config:
                scrape_configs: []
          processors:
            # Every dashboard and recording rule selects by `cluster`; the
            # hub's own series need it as much as the spokes'.
            transform/cluster:
              metric_statements:
                - context: datapoint
                  statements:
                    - set(attributes["cluster"], "gitops_cluster")
            batch: {}
          exporters:
            # The hub Prometheus runs two replicas, and pushed data is not
            # replicated between them. Sending through the Service would
            # load-balance each batch to one replica, leaving both with half
            # the data and every query a coin toss. Each replica gets its own
            # exporter, by pod DNS name, so both hold everything.
            otlp_http/prometheus-0:
              endpoint: http://prometheus-prometheus-monitoring-kube-prometheus-0.prometheus-operated.monitoring.svc.cluster.local:9090/api/v1/otlp
              # A Prometheus replica restart, WAL replay included, outlasts the
              # default 5m of retries, and the batch is then dropped: replica 1
              # lost samples that way during a rollout.
              retry_on_failure:
                enabled: true
                max_elapsed_time: 15m
              sending_queue:
                enabled: true
                queue_size: 5000
            otlp_http/prometheus-1:
              endpoint: http://prometheus-prometheus-monitoring-kube-prometheus-1.prometheus-operated.monitoring.svc.cluster.local:9090/api/v1/otlp
              # A Prometheus replica restart, WAL replay included, outlasts the
              # default 5m of retries, and the batch is then dropped: replica 1
              # lost samples that way during a rollout.
              retry_on_failure:
                enabled: true
                max_elapsed_time: 15m
              sending_queue:
                enabled: true
                queue_size: 5000
            # Dual-write while Mimir is evaluated beside Prometheus. Mimir
            # replicates internally, so one exporter through its gateway is
            # enough. Same 15m retry and queue: an ingester rollout must not
            # drop batches, and a stalled Mimir only backs up this queue --
            # each exporter has its own, so Prometheus is not held up.
            otlp_http/mimir:
              endpoint: http://mimir-gateway.mimir.svc.cluster.local/otlp
              retry_on_failure:
                enabled: true
                max_elapsed_time: 15m
              sending_queue:
                enabled: true
                queue_size: 5000
          service:
            pipelines:
              metrics:
                receivers: [prometheus]
                processors: [transform/cluster, batch]
                exporters: [otlp_http/prometheus-0, otlp_http/prometheus-1, otlp_http/mimir]

    # Applied to the collector CRs the chart generates.
    defaultCRConfig:
      config:
        service:
          telemetry:
            logs:
              # Each error was followed by a multi-line Go stack trace, and
              # the log collector ships every line as its own record: ~10
              # level-less records per error, shown as UNK in Grafana. The
              # error line already names the component and the cause.
              disable_stacktrace: true
      # A collector that cannot schedule is a blind spot, and these nodes run
      # hot. Same reasoning as #52 for Alloy.
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi

    # The operator is not optional here. This chart ships an
    # OpenTelemetryCollector custom resource rather than a DaemonSet directly,
    # and without the operator to reconcile it the CR is inert and nothing
    # collects anything.
    opentelemetry-operator:
      enabled: true
    # Auto-instrumentation of application code is a separate concern and
    # nothing here is instrumented yet.
    instrumentation:
      enabled: false

    # system-node-critical above is rejected in any namespace lacking a quota
    # whose scopeSelector matches it -- GKE only ships gcp-critical-pods in
    # kube-system and its own managed namespaces. Same thing that bit Alloy in
    # #52. pods: 1G mirrors GKE's: present, not limiting.
    extraObjects:
      # Mesh metrics, for Kiali and Grafana: every Envoy's stats endpoint
      # (port http-envoy-prom; pods without it yield no targets), and
      # istiod's own. Picked up by the cluster collector's target allocator.
      - apiVersion: monitoring.coreos.com/v1
        kind: PodMonitor
        metadata:
          name: envoy-stats
          namespace: opentelemetry
        spec:
          jobLabel: envoy-stats
          namespaceSelector:
            any: true
          selector: {}
          podMetricsEndpoints:
            - port: http-envoy-prom
              path: /stats/prometheus
              interval: 30s
      # Kiali's chart ships a NetworkPolicy admitting only its own ports
      # (20001, 9090), which blocks its sidecar's stats port: the scrape
      # above timed out for every meshed Kiali. NetworkPolicies are
      # additive, so this opens 15090 to the collectors' namespace alone and
      # leaves Kiali's own policy intact.
      - apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: kiali-envoy-stats
          namespace: istio-system
        spec:
          podSelector:
            matchLabels:
              app.kubernetes.io/name: kiali
          policyTypes: [Ingress]
          ingress:
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: opentelemetry
              ports:
                - port: 15090
                  protocol: TCP
      - apiVersion: monitoring.coreos.com/v1
        kind: ServiceMonitor
        metadata:
          name: istiod
          namespace: opentelemetry
        spec:
          namespaceSelector:
            matchNames: [istio-system]
          # Two Services front the same istiod pods: the revision's and the
          # `stable` tag's. Only the tag's carries istio.io/tag; selecting
          # both would scrape istiod twice.
          selector:
            matchLabels:
              app: istiod
            matchExpressions:
              - key: istio.io/tag
                operator: DoesNotExist
          endpoints:
            - port: http-monitoring
              interval: 30s
      - apiVersion: v1
        kind: Service
        metadata:
          name: otel-gateway-ilb
          namespace: opentelemetry
          annotations:
            networking.gke.io/load-balancer-type: "Internal"
        spec:
          type: LoadBalancer
          # Reserved in shared-network.tf. Spoke collectors hardcode it, so it
          # has to survive a hub rebuild; an unreserved internal LB takes a
          # fresh address every time it is recreated.
          loadBalancerIP: "10.30.127.200"
          # The operator derives these from the CR's namespace and name
          # (internal/manifests/manifestutils/labels.go), so they track the
          # gateway's suffix above.
          selector:
            app.kubernetes.io/managed-by: opentelemetry-operator
            app.kubernetes.io/instance: opentelemetry.otel-kube-stack-gateway
            app.kubernetes.io/part-of: opentelemetry
            app.kubernetes.io/component: opentelemetry-collector
          ports:
            - name: otlp-grpc
              port: 4317
              targetPort: 4317
              protocol: TCP
            - name: otlp-http
              port: 4318
              targetPort: 4318
              protocol: TCP
      - apiVersion: v1
        kind: ResourceQuota
        metadata:
          name: critical-pods
          namespace: opentelemetry
        spec:
          hard:
            pods: 1G
          scopeSelector:
            matchExpressions:
              - operator: In
                scopeName: PriorityClass
                values:
                  - system-node-critical
                  - system-cluster-critical

    # kube-prometheus-stack owns both already; a second copy of node-exporter
    # would collide on its hostPort.
    kubeStateMetrics:
      enabled: false
    nodeExporter:
      enabled: false
    # The apiserver monitor, authenticated by token file rather than Secret.
    kubernetesServiceMonitors:
      enabled: true
    kubeApiServer:
      enabled: true
    # GKE runs kube-dns, not CoreDNS; the hub now scrapes it the same way the
    # spokes do (see prometheus.yaml for the CoreDNS monitor this replaces).
    kubeDns:
      enabled: true
