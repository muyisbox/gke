name: prometheus-monitoring
chart: kube-prometheus-stack
repoURL: https://prometheus-community.github.io/helm-charts
targetRevision: "91.5.0"
namespace: monitoring
cluster_env: gitops
helm:
  values:
    # Helm never upgrades CRDs on `helm upgrade`. Every chart major from
    # 83 to 91 ships a newer prometheus-operator CRD set, so let the chart
    # run its own CRD upgrade job instead of applying them by hand.
    crds:
      upgradeJob:
        enabled: true
        forceConflicts: true
    alertmanager:
      alertmanagerSpec:
        replicas: 2
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: standard
              resources:
                requests:
                  storage: 5Gi
    grafana:
      additionalDataSources:
        - name: Tempo
          access: proxy
          orgId: 1
          type: tempo
          url: http://tempo.tracing.svc.cluster.local:3200
          version: 1
        - name: Loki
          access: proxy
          orgId: 1
          type: loki
          jsonData:
            tlsSkipVerify: true
          url: http://loki.logging.svc.cluster.local:3100
          version: 1
    prometheus:
      # Reserved in shared-network.tf. Spoke Prometheus instances write here,
      # so the address has to outlive a hub rebuild.
      service:
        type: LoadBalancer
        loadBalancerIP: "10.30.127.201"
        annotations:
          networking.gke.io/load-balancer-type: "Internal"
      prometheusSpec:
        # Was set at the top level of values, which kube-prometheus-stack does
        # not read, so it never reached the Prometheus spec. It matters now:
        # once three clusters remote-write into one store, this label is the
        # only thing keeping their series apart.
        externalLabels:
          cluster: gitops_cluster
        # Off by default. Without it the spokes' remote_write is refused.
        enableRemoteWriteReceiver: true
        replicas: 2
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: standard
              resources:
                requests:
                  storage: 10Gi
    # Both of these ran as BestEffort (no requests at all), were packed onto the
    # smallest node in the cluster, and exited 2 in a crash loop.
    kube-state-metrics:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
    prometheusOperator:
      enabled: true
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 512Mi
      admissionWebhooks:
        patch:
          podAnnotations:
            sidecar.istio.io/inject: "false"
