name: prometheus-monitoring
chart: kube-prometheus-stack
repoURL: https://prometheus-community.github.io/helm-charts
targetRevision: "91.5.0"
namespace: monitoring
cluster_env: gitops
# Telemetry pipeline: kept out of the mesh (see the ApplicationSet template).
istioInjection: disabled
helm:
  values:
    # The chart's CRD upgrade job exists because `helm upgrade` never
    # touches CRDs. Nothing here runs `helm upgrade`: Argo renders the
    # chart with --include-crds and applies all ten CRDs itself with
    # server-side apply, which the app's managed-resource list confirms.
    # Rendering with the job on and off produces the same ten CRDs, so it
    # buys nothing -- and it costs: the sync parks indefinitely on
    # "waiting for completion of hook ClusterRoleBinding/
    # prometheus-monitoring-crds-upgrade", and the hook pulls
    # docker.io/busybox:latest, which these clusters cannot pull
    # anonymously (the same 401 that stops envoy-gateway refreshing).
    crds:
      enabled: true
    alertmanager:
      alertmanagerSpec:
        replicas: 2
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: standard
              resources:
                requests:
                  storage: 5Gi
    grafana:
      # Two replicas minimum, scaling to four on load. No shared database:
      # every dashboard and datasource is provisioned from git, so each
      # replica builds the same state at startup, and the SQLite store is an
      # emptyDir that never outlived a restart even with one replica.
      autoscaling:
        enabled: true
        minReplicas: 2
        maxReplicas: 4
        targetCPU: "70"
      # A login session lives in the database of the replica that issued it.
      # Pinning each client to one replica keeps a session from bouncing to a
      # replica that has never heard of it and logging the user out.
      service:
        sessionAffinity: ClientIP
      podDisruptionBudget:
        minAvailable: 1
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: grafana
      # Ran as BestEffort: first to be starved on a node the unrequested
      # Prometheus had already overfilled, so /api/health missed its probes.
      # Sized to observed use (~560-700Mi). Every container needs a request
      # or the HPA cannot compute utilisation at all.
      resources:
        requests:
          cpu: 100m
          memory: 768Mi
        limits:
          memory: 1536Mi
      # The chart's 1s readiness timeout pulled a busy-but-healthy pod out of
      # the Service on a single slow answer.
      readinessProbe:
        httpGet:
          path: /api/health
          port: grafana
        timeoutSeconds: 5
        periodSeconds: 10
        failureThreshold: 3
      # The bundled dashboards gain a `cluster` selector. Without it every
      # panel silently sums dev, staging and the hub together.
      sidecar:
        datasources:
          # The chart (grafana 13.2.5) only sets HEALTH_PORT on the optional
          # init container, but the k8s-sidecar image starts a health server
          # in every container on a default port -- so the dashboards and
          # datasources sidecars, sharing one pod network, collided ("OSError:
          # Address in use", a traceback on every start). The chart's own
          # intended ports, set explicitly.
          env:
            HEALTH_PORT: "8082"
          # Exemplars on the default Prometheus datasource link to Tempo.
          exemplarTraceIdDestinations:
            datasourceUid: tempo
            traceIdLabelName: traceID
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
        dashboards:
          env:
            HEALTH_PORT: "8084"
          multicluster:
            global:
              enabled: true
      # Fixed UIDs: the cross-links below name their targets by UID, and
      # without one each Grafana replica generated its own at random.
      additionalDataSources:
        - name: Tempo
          uid: tempo
          access: proxy
          orgId: 1
          type: tempo
          url: http://tempo.tracing.svc.cluster.local:3200
          version: 1
          jsonData:
            # Span -> its pod's logs, around the span's time window. Spans
            # carry the real pod, namespace and cluster (set by the
            # collector from the sending pod), which Loki indexes as labels.
            tracesToLogsV2:
              datasourceUid: loki
              spanStartTimeShift: "-5m"
              spanEndTimeShift: "5m"
              tags:
                - key: k8s.cluster.name
                  value: k8s_cluster_name
                - key: k8s.namespace.name
                  value: k8s_namespace_name
                - key: k8s.pod.name
                  value: k8s_pod_name
            # Span -> its service's request rate and latency, from the span
            # metrics Tempo's generator writes to Prometheus.
            tracesToMetrics:
              datasourceUid: prometheus
              spanStartTimeShift: "-5m"
              spanEndTimeShift: "5m"
              tags:
                - key: service.name
                  value: service
              queries:
                - name: Request rate
                  query: sum(rate(traces_spanmetrics_calls_total{$$__tags}[5m]))
                - name: p95 latency
                  query: histogram_quantile(0.95, sum by (le) (rate(traces_spanmetrics_latency_bucket{$$__tags}[5m])))
            # Service graph from the generator's service_graphs metrics.
            serviceMap:
              datasourceUid: prometheus
            nodeGraph:
              enabled: true
            lokiSearch:
              datasourceUid: loki
        - name: Loki
          uid: loki
          access: proxy
          orgId: 1
          type: loki
          url: http://loki.logging.svc.cluster.local:3100
          version: 1
          jsonData:
            tlsSkipVerify: true
            # Log line -> trace. The first matches the trace_id field in
            # Istio's JSON access logs; the second, the trace_id that
            # OTel-instrumented apps attach to their own log records.
            derivedFields:
              - name: TraceID
                matcherRegex: '"trace_id":"([0-9a-f]{32})"'
                url: "$${__value.raw}"
                datasourceUid: tempo
                urlDisplayLabel: View trace
              - name: trace_id
                matcherType: label
                matcherRegex: trace_id
                url: "$${__value.raw}"
                datasourceUid: tempo
                urlDisplayLabel: View trace
    prometheus:
      # Reserved in shared-network.tf. Nothing writes here any more -- metrics
      # arrive over OTLP through the gateway -- but each spoke's Kiali queries
      # its own cluster's Istio metrics from this store, so it stays reachable
      # on the VPC at an address that outlives a hub rebuild.
      service:
        type: LoadBalancer
        loadBalancerIP: "10.30.127.201"
        annotations:
          networking.gke.io/load-balancer-type: "Internal"
      prometheusSpec:
        # Storage and rule evaluation only. Every cluster's collector,
        # this one's included, scrapes and pushes over OTLP; the `cluster`
        # label is set there, on every series, so no externalLabels are
        # needed to tell clusters apart.
        enableOTLPReceiver: true
        # The disk is 10Gi and three clusters write ~2GB a day; with only a
        # 10d time limit it would have filled in about 5 days, and Prometheus
        # fails outright on a full disk. Past this size the oldest blocks go
        # first. A stopgap until Mimir on GCS takes over long-term storage.
        retentionSize: 8GB
        # Tempo's metrics generator writes its span metrics and service graph
        # here by remote-write (it has no OTLP output). It sends to each
        # replica's pod address, inside the cluster.
        enableRemoteWriteReceiver: true
        # Keeps the exemplars Tempo attaches -- a trace ID per latency
        # bucket -- which is what lets a Grafana graph link to the trace
        # behind a data point. Off by default; without it they are dropped
        # on arrival.
        enableFeatures:
          - exemplar-storage
        # Pushed data can land late: collector retries after a hub restart,
        # two gateway replicas interleaving. Without a window those samples
        # are refused as out of order and simply lost.
        tsdb:
          outOfOrderTimeWindow: 30m
        # Scrape nothing directly. The collectors already scrape every
        # ServiceMonitor through the target allocator; if Prometheus also
        # did, the hub's series would exist twice -- once with `cluster`,
        # once without. No ServiceMonitor carries this label.
        serviceMonitorSelector:
          matchLabels:
            scraped-by: prometheus-server
        podMonitorSelector:
          matchLabels:
            scraped-by: prometheus-server
        probeSelector:
          matchLabels:
            scraped-by: prometheus-server
        scrapeConfigSelector:
          matchLabels:
            scraped-by: prometheus-server
        replicas: 2
        # Ran with no requests or limits. Each replica holds ~1M active series
        # from three clusters and uses ~2.6Gi and half a core, but the
        # scheduler counted it as zero and packed other pods beside it: one
        # node showed 54% of memory requested and 92% used, and its
        # neighbours (operator, kube-state-metrics, node-exporter, Grafana)
        # were the ones killed. Requests sized to observed use; the limit
        # leaves room for the WAL replay spike on restart.
        resources:
          requests:
            cpu: 500m
            memory: 3Gi
          limits:
            memory: 5Gi
        # One replica per node, so a node failure cannot take both and the
        # two 3Gi requests never land on one 8Gi machine.
        podAntiAffinity: hard
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: standard
              resources:
                requests:
                  storage: 10Gi
    # Google manages these on GKE and exposes none of them. Their monitors
    # could only ever report down -- and with them on, the bundled
    # KubeControllerManagerDown/KubeSchedulerDown-style alerts fire forever.
    kubeControllerManager:
      enabled: false
    # GKE runs kube-dns, not CoreDNS: this monitor scraped :9153 on the
    # kube-dns pods, where nothing listens -- 120 failed scrapes every 30
    # minutes. kube-dns is scraped through the otel chart instead, as on
    # the spokes.
    coreDns:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    # Both of these ran as BestEffort (no requests at all), were packed onto the
    # smallest node in the cluster, and exited 2 in a crash loop.
    kube-state-metrics:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
    # Also BestEffort, and so among the first killed under node pressure.
    prometheus-node-exporter:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
    prometheusOperator:
      enabled: true
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 512Mi
      admissionWebhooks:
        patch:
          podAnnotations:
            sidecar.istio.io/inject: "false"
