name: prometheus-monitoring
chart: kube-prometheus-stack
repoURL: https://prometheus-community.github.io/helm-charts
targetRevision: "91.5.0"
namespace: monitoring
cluster_env: gitops
helm:
  values:
    # Helm never upgrades CRDs on `helm upgrade`. Every chart major from
    # 83 to 91 ships a newer prometheus-operator CRD set, so let the chart
    # run its own CRD upgrade job instead of applying them by hand.
    crds:
      upgradeJob:
        enabled: true
        forceConflicts: true
    externalLabels:
      cluster: gitops_cluster
    alertmanager:
      alertmanagerSpec:
        replicas: 2
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: standard
              resources:
                requests:
                  storage: 5Gi
    grafana:
      additionalDataSources:
        - name: Loki
          access: proxy
          orgId: 1
          type: loki
          jsonData:
            tlsSkipVerify: true
          url: http://loki.logging.svc.cluster.local:3100
          version: 1
    prometheus:
      prometheusSpec:
        replicas: 2
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: standard
              resources:
                requests:
                  storage: 10Gi
    # Both of these ran as BestEffort (no requests at all), were packed onto the
    # smallest node in the cluster, and exited 2 in a crash loop.
    kube-state-metrics:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
    prometheusOperator:
      enabled: true
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 512Mi
      admissionWebhooks:
        patch:
          podAnnotations:
            sidecar.istio.io/inject: "false"
