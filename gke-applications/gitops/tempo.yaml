name: tempo
# Traces backend for the hub. The cluster has had no tracing at all; Istio
# already emits Envoy spans, so this gives distributed tracing without any
# application instrumentation.
#
# Hub only. Spokes ship traces here rather than each keeping their own, so a
# trace survives the nightly destroy of the cluster that produced it.
chart: tempo
repoURL: https://grafana-community.github.io/helm-charts
targetRevision: "3.1.0"
namespace: tracing
cluster_env: gitops
# Telemetry pipeline: kept out of the mesh (see the ApplicationSet template).
istioInjection: disabled
helm:
  values:
    tempo:
      # OTLP is what everything here speaks. The chart's Jaeger receivers stay
      # enabled whether we want them or not: Helm merges maps so listing otlp
      # alone does not displace them, and setting jaeger to null fails the
      # render outright because _ports.tpl dereferences
      # receivers.jaeger.protocols.thrift_http unconditionally. They are
      # reachable only in-cluster, so this is noise rather than exposure.
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
      retention: 168h # 7d
      # Derives request-rate, error and latency metrics from every span, and
      # a service graph from client/server span pairs, and writes them to
      # Mimir with exemplars: each latency bucket carries the ID of a
      # real trace that landed in it, which is what lets a Grafana graph link
      # straight to the trace. TraceQL metrics (Traces Drilldown) need none of
      # this -- Tempo 3 serves them natively.
      metricsGenerator:
        enabled: true
        processor:
          span_metrics:
            # Without these, every cluster's spans for a service collapse into
            # one series. Labels become cluster / k8s_namespace_name: the
            # collectors set the `cluster` resource attribute on every span,
            # the same key metrics and logs carry.
            dimensions: [cluster, k8s.namespace.name]
          service_graphs:
            # Edges carry both ends: client_cluster / server_cluster, ...
            dimensions: [cluster, k8s.namespace.name]
        registry:
          collection_interval: 15s
        storage:
          # One URL through Mimir's gateway: Mimir replicates internally. The
          # hub Prometheus is retired; writing to its pods would only fail and
          # back up the generator's queue.
          remote_write:
            - url: http://mimir-gateway.mimir.svc.cluster.local/api/v1/push
              send_exemplars: true
      overrides:
        defaults:
          metrics_generator:
            processors: [span-metrics, service-graphs]
        per_tenant_override_config: /conf/overrides.yaml
      # Blocks go to GCS, so trace history no longer lives on one pod's disk
      # and survives the node, zone or cluster. Only the WAL -- the last few
      # minutes before a block is cut -- stays on the local volume.
      storage:
        trace:
          backend: gcs
          gcs:
            bucket_name: cluster-dreams-tempo
          wal:
            path: /var/tempo/wal
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi
    # Workload Identity to tempo-storage, which can read and write only the
    # Tempo bucket (observability-storage.tf).
    serviceAccount:
      name: tempo
      annotations:
        iam.gke.io/gcp-service-account: tempo-storage@cluster-dreams.iam.gserviceaccount.com
    # Holds the WAL. Without it a restart would lose the traces not yet cut
    # into a block and shipped to GCS.
    persistence:
      enabled: true
      size: 20Gi
    # ClusterIP on purpose. Spokes never reach Tempo directly -- they ship OTLP
    # to the hub's gateway collector, which is the only telemetry ingress on
    # the VPC. One door to secure instead of one per signal.
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: prometheus-monitoring
