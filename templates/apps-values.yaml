applicationsets:
  %{~ for cluster_name, cluster in clusters ~}
  ${cluster_name}-apps:
    namespace: argocd
    generators:
    - git:
        repoURL: ${repo_url}
        revision: ${repo_revision}
        files:
        - path: gke-applications/${cluster_name}/*.yaml
    template:
      metadata:
        name: '{{.name}}-${cluster_name}'
        namespace: argocd
        labels:
          app.kubernetes.io/name: '{{.name}}'
          app.kubernetes.io/managed-by: argocd
          dynamou.io/cluster: ${cluster_name}
          dynamou.io/env: '{{.cluster_env}}'
        finalizers:
        - resources-finalizer.argocd.argoproj.io
      spec:
        project: project-${cluster_name}
        source:
          repoURL: '{{.repoURL}}'
          targetRevision: '{{.targetRevision}}'
          chart: '{{.chart}}'
          helm:
            releaseName: '{{.name}}'
        destination:
          name: ${cluster_name}-cluster
          namespace: '{{.namespace}}'
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
          # Apps here install CRDs that sibling apps' manifests depend on, and
          # nothing orders them. A ServiceMonitor applied before
          # kube-prometheus-stack lands, or a Certificate applied before
          # cert-manager's webhook has endpoints, fails -- and after five
          # internal attempts Argo stops, leaving the app permanently broken
          # with no further retries. On a cluster that is destroyed and rebuilt
          # nightly that turns a startup race into whichever apps lost the race
          # that morning. This keeps retrying for ~1h so the dependency
          # eventually appears and the sync completes on its own.
          retry:
            limit: 20
            backoff:
              duration: 15s
              factor: 2
              maxDuration: 5m
          syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          managedNamespaceMetadata:
            labels:
              istio.io/revy: stable
    syncPolicy:
      applicationsSync: sync
    goTemplate: true
    templatePatch: |
      {{- if .helm }}
      spec:
        source:
          helm:
            releaseName: '{{.name}}'
            {{- if .helm.values }}
            valuesObject:
              {{- toYaml .helm.values | nindent 14 }}
            {{- end }}
            {{- if .helm.valueFiles }}
            valueFiles:
              {{- range $f := .helm.valueFiles }}
              - {{ $f }}
              {{- end }}
            {{- end }}
      {{- end }}
  %{~ endfor ~}

projects:
  %{~ for cluster_name, cluster in clusters ~}
  project-${cluster_name}:
    namespace: argocd
    finalizers:
    - resources-finalizer.argocd.argoproj.io
    description: Project for ${cluster_name} cluster
    sourceRepos:
    - '*'
    destinations:
    - name: ${cluster_name}-cluster
      namespace: '*'
    namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
    clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  %{~ endfor ~}
