configs:
  cm:
    exec.enabled: true
  repositories:
    gke-gitops-repo:
      url: ${repo_url}
      name: gke-gitops
      type: git

global:
  # Chart 10.x turns this on by default. Kept explicit so the setting is a
  # decision rather than a default that can flip under us on the next bump.
  networkPolicy:
    create: true

server:
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 50
    targetMemoryUtilizationPercentage: 50
  serviceAccount:
    annotations:
      iam.gke.io/gcp-service-account: ${gcp_service_account}

controller:
  replicas: 2
  serviceAccount:
    annotations:
      iam.gke.io/gcp-service-account: ${gcp_service_account}

repoServer:
  autoscaling:
    enabled: true
    minReplicas: 2

applicationSet:
  replicaCount: 2

redis-ha:
  enabled: true
