configs:
  cm:
    exec.enabled: true
  params:
    # Two controller replicas, but the default (legacy) hash sharding put
    # every cluster on shard 1: controller-1 ran at ~900m CPU / 2.4Gi while
    # controller-0 idled at 9m. Round-robin spreads the three clusters 2/1.
    controller.sharding.algorithm: round-robin
  repositories:
    gke-gitops-repo:
      url: ${repo_url}
      name: gke-gitops
      type: git

global:
  # Chart 10.x turns this on by default. Kept explicit so the setting is a
  # decision rather than a default that can flip under us on the next bump.
  networkPolicy:
    create: true

server:
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 50
    targetMemoryUtilizationPercentage: 50
  serviceAccount:
    annotations:
      iam.gke.io/gcp-service-account: ${gcp_service_account}
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: prometheus-monitoring

controller:
  replicas: 2
  # Ran as BestEffort, so the scheduler packed it onto a node already at
  # 102% CPU / 108% memory as if it cost nothing. Starved, its Lua health
  # checks on the large prometheus-operator, Istio and Rollouts CRDs hit
  # "context deadline exceeded", which aborts the whole sync -- that is
  # what held the Prometheus CRs (externalLabels, remote-write) back after
  # every other blocker was fixed. Requests sized to what it actually uses.
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      memory: 3Gi
  serviceAccount:
    annotations:
      iam.gke.io/gcp-service-account: ${gcp_service_account}
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: prometheus-monitoring

repoServer:
  autoscaling:
    enabled: true
    minReplicas: 2
  # The repo-server ran as BestEffort. Rendering kube-prometheus-stack and Loki
  # starved it enough that /healthz stopped answering within the probe timeout,
  # so the kubelet killed it mid-render. Every Application then failed to sync
  # with "connection refused" or "produced zero addresses" against the
  # repo-server Service.
  resources:
    requests:
      cpu: 150m
      memory: 512Mi
    limits:
      memory: 2Gi
  # Chart defaults are timeoutSeconds 1. A large chart render can block the
  # health handler for longer than that without the process being unhealthy.
  livenessProbe:
    timeoutSeconds: 10
    failureThreshold: 5
  readinessProbe:
    timeoutSeconds: 10
    failureThreshold: 5
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: prometheus-monitoring

applicationSet:
  replicaCount: 2
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: prometheus-monitoring
redis-ha:
  enabled: true
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: prometheus-monitoring