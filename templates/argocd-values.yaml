configs:
  cm:
    exec.enabled: true
  repositories:
    gke-gitops-repo:
      url: ${repo_url}
      name: gke-gitops
      type: git

global:
  # Chart 10.x turns this on by default. Kept explicit so the setting is a
  # decision rather than a default that can flip under us on the next bump.
  networkPolicy:
    create: true

server:
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 50
    targetMemoryUtilizationPercentage: 50
  serviceAccount:
    annotations:
      iam.gke.io/gcp-service-account: ${gcp_service_account}

controller:
  replicas: 2
  serviceAccount:
    annotations:
      iam.gke.io/gcp-service-account: ${gcp_service_account}

repoServer:
  autoscaling:
    enabled: true
    minReplicas: 2
  # The repo-server ran as BestEffort. Rendering kube-prometheus-stack and Loki
  # starved it enough that /healthz stopped answering within the probe timeout,
  # so the kubelet killed it mid-render. Every Application then failed to sync
  # with "connection refused" or "produced zero addresses" against the
  # repo-server Service.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
  # Chart defaults are timeoutSeconds 1. A large chart render can block the
  # health handler for longer than that without the process being unhealthy.
  livenessProbe:
    timeoutSeconds: 10
    failureThreshold: 5
  readinessProbe:
    timeoutSeconds: 10
    failureThreshold: 5

applicationSet:
  replicaCount: 2

redis-ha:
  enabled: true
